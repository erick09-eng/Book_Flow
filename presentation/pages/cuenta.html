<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookFlow - Mi perfil</title>
    <link rel="stylesheet" href="../styles/cuenta.css">
</head>
<body>
    <!-- El header y el footer los inserta js/app.js -->
    <main class="wrap">
        <nav class="tabs" id="acc-nav" aria-label="Mi cuenta"></nav>
        <section class="panel panel--wide">
            <h1 class="panel__title">Hola, <span id="u-name"></span></h1>
            <div class="stats">
                <div class="stats__item"><span class="stats__value" id="s-active"></span><span class="stats__label">Préstamos activos</span></div>
                <div class="stats__item"><span class="stats__value" id="s-history"></span><span class="stats__label">Libros devueltos</span></div>
                <div class="stats__item"><span class="stats__value" id="s-likes"></span><span class="stats__label">Favoritos</span></div>
            </div>
            <dl>
                <div class="account__row"><dt>Correo</dt><dd id="u-email"></dd></div>
                <div class="account__row"><dt>Miembro desde</dt><dd id="u-since"></dd></div>
            </dl>
            <div class="account__actions">
                <button class="btn btn--primary" data-edit>Modificar datos</button>
                <button class="btn btn--ghost" data-pass>Cambiar contraseña</button>
                <button class="btn btn--ghost" data-logout>Cerrar sesión</button>
                <button class="btn btn--danger" data-delete>Eliminar cuenta</button>
            </div>
        </section>
    </main>
    <script src="../js/service/storage.js"></script>
    <script src="../js/service/bookService.js"></script>
    <script src="../js/service/loanService.js"></script>
    <script src="../js/service/favoriteService.js"></script>
    <script src="../js/service/usersService.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
